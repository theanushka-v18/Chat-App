<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4a57a8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151830" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Orbither — real time chat for teams and friends"
    />
    <title>Orbither</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mantine-color-scheme-value");
          var scheme =
            stored && stored !== "auto"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-mantine-color-scheme", scheme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
